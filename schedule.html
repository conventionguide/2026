d0deea;border-radius:4px}.event{position:absolute;left:0;right:0;display:grid;grid-template-columns:43px minmax(0,1fr);column-gap:10px;align-items:start}.event.compact .content{display:grid;grid-template-columns:64px minmax(0,1fr);gap:0 8px;align-items:center}.event.compact .clock{font-size:17px}.event.compact .event-title{margin:0;font-size:15px}.event.compact .desc{grid-column:1/-1}.event.compact .alert{grid-column:1/-1;margin-top:4px;padding:5px 7px;font-size:11px;line-height:1.32}.event.compact .alert b{font-size:10px}.event.compact .content{padding-top:0}.event.compact .marker{width:25px;height:25px;top:0}.event.compact .marker svg{height:16px;width:16px}.marker{position:absolute;top:1px;left:var(--line-x);transform:translateX(-50%);background:#fff;color:var(--blue);z-index:2;width:29px;height:29px;display:grid;place-items:center;border-radius:50%;border:2px solid currentColor}.marker svg{width:18px;height:18px;stroke-width:2.2;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round}.event.urgent .marker{color:var(--red)}.content{grid-column:2;padding:1px 0 0}.clock{font-size:19px;font-weight:800;line-height:1.35;letter-spacing:-.025em;font-variant-numeric:tabular-nums;color:var(--ink)}.event.urgent .clock{color:var(--red)}.event-title{font-size:16px;font-weight:800;line-height:1.4;margin-top:5px;letter-spacing:-.03em}.desc{font-size:13px;color:var(--muted);line-height:1.45;margin-top:5px;white-space:pre-line}.alert{display:flex;gap:7px;color:var(--red);background:#fcf0f1;border-radius:11px;padding:7px 9px;margin-top:7px;font-size:12px;line-height:1.4;font-weight:750}.alert b{flex:none}.extras{margin-top:16px;padding:15px;background:#f5f6f8;border-radius:14px;font-size:14px;line-height:1.65}.footer{padding:16px 4px;text-align:center;color:#9aa1aa;font-size:11px}.hidden{display:none}.export{display:flex;justify-content:center;margin-top:16px}.export button{border:1px solid #d4d9df;border-radius:12px;background:white;font:inherit;font-size:13px;p
