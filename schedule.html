<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#242835;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{max-width:820px;margin:auto;padding:24px 15px 70px}header{padding:18px 5px}header small{letter-spacing:2px;color:#668aa9;font-weight:800;font-size:11px}h1{font-size:29px;letter-spacing:-1px;margin:12px 0;line-height:1.3}.subtitle{color:#6c7480;font-size:14px;line-height:1.6}.pills{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.pill{font-weight:700;color:#4e6d88;background:#e9eff6;font-size:12px;border-radius:100px;padding:8px 12px}.tabs{position:sticky;top:0;background:#f6f7f9f5;z-index:20;display:flex;overflow-x:auto;scrollbar-width:none;padding:12px 1px;gap:8px}.tabs button{flex:1 0 74px;border:1px solid #dedfe4;color:#596170;background:white;border-radius:15px;padding:13px 11px;font-weight:800;cursor:pointer}.tabs button.active{background:#272d3b;color:white;border-color:#272d3b}.card{background:white;border:1px solid #e1e3e7;border-radius:26px;padding:25px 17px;box-shadow:0 4px 18px #22222206}.date{font-size:13px;font-weight:750;color:#747a86}.tag{font-size:11px;border-radius:99px;background:#f0f1f3;padding:8px;color:#5b6170;font-weight:700}.heading{display:flex;gap:10px;align-items:center;justify-content:space-between}.card h2{font-size:22px;letter-spacing:-.7px;margin:12px 0 22px}.axis{position:relative;overflow:hidden}.rail{position:absolute;top:0;bottom:0;left:15px;width:3px;border-radius:2px;background:#cbdce9}.ticks{position:absolute;left:9px;right:auto;height:1px;width:14px;background:#dae3eb}.ticktext{position:absolute;left:37px;font-size:10px;color:#afb9c3;transform:translateY(-50%)}.point{position:absolute;left:7px;width:19px;height:19px;transform:translateY(-50%);border:4px solid #5f98c0;border-radius:50%;background:white;z-index:2}.point.important{border-color:#ad4d50}.point.breakfast{border-color:#d07743}.timepin{position:absolute;left:42px;transform:translateY(-50%);font-size:1 합", "", "", "important"], ["18:30", "호텔 → 호텔 이동", "", "", ""], ["19:00", "저녁 식사 겸 회식", "", "", ""], ["21:00", "호텔 → 호텔 이동", "", "", ""], ["21:30", "호텔 체크인", "", "", ""], ["22:30", "정말 자유일정 시작!", "", "", ""]], "notes": ["🥪 간식 제공 — 시간 맞춰 집합 필수! (원본에 별도 집합 시각 미기재)", "컨벤션 마무리 및 정리 시각은 원본의 구간 배치를 참고했습니다.", "컨벤션 마무리 및 정리 — 정확한 시작 시각 별도 표기 없음"]}, {"date": "11월 9일 (월)", "title": "🌿 항저우 자유여행", "tag": "자유일정", "start": "07:00", "end": "18:00", "events": [["07:00", "조식 (호텔 뷔페)", "조식당 운영 시간은 오전 7시부터 10시까지입니다.", "", ""]], "notes": ["하루 자유일정 — 관광, 쇼핑, 맛집 등 각자 계획한 일정으로 자유롭게 여행해 주세요."]}, {"date": "11월 10일 (화)", "title": "🛬 항저우 → 인천 귀국", "tag": "귀국일", "start": "07:00", "end": "20:00", "events": [["07:00", "조식 (호텔 뷔페) 및 자유일정", "", "", ""], ["10:30", "호텔 로비 집합 / 체크아웃", "짐을 모두 챙겨 로비로 모여 주세요.", "집합 시간 엄수", "important"], ["11:00", "공항 이동", "", "", ""], ["12:00", "중식 제공", "이후 체크인 및 출국장 자유시간", "시간 맞춰 집합 필수!", "important"], ["15:00", "항저우 → 인천 비행", "", "", ""]], "notes": ["중식 제공과 체크인의 정확한 순서는 현장 안내에 따릅니다.", "항공편의 실제 출발·도착 시각은 항공권으로 확인해 주세요.", "귀국 후 일정 종료 — 부산·대구로 각자의 집에 돌아갈 때까지 조금 더 힘내주세요. 안전귀가!!"]}];
const mins=s=>{let [h,m]=s.split(':').map(Number);return h*60+m};
const scale=1.35; // 81 pixels per real hour, exactly proportional
const tabs=document.querySelector('#tabs'),pages=document.querySelector('#pages');
function escapeHtml(t){return String(t||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));}
days.forEach((day,index)=>{let b=document.createElement('button');b.textContent='DAY '+String(index+1).padStart(2,'0');b.onclick=()=>show(index);tabs.append(b);const section=document.createElement('section');section.className='other';const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="heading"><div class="date">DAY ${String(index+1).padStart(2,'0')} · ${day.date}</div><div class="tag">${day.tag}</div></div><h2>${day.title}</h2><div class="axis"><div class="rail"></div></div><div class="notes"></div>`;section.append(card);pages.append(section);const axis=card.querySelector('.axis'),notes=card.querySelector('.notes'),base=mins(day.start);let events=day.events;let maxY=0;for(let [time,name,details,warning,type] of events){let y=22+(mins(time)-base)*scale;maxY=Math.max(maxY,y);const dot=document.createElement('span');dot.className='point '+(type||'');dot.style.top=y+'px';axis.append(dot);const pin=document.createElement('span');pin.className='timepin';pin.style.top=y+'px';pin.textContent=time;axis.append(pin);const content=document.createElement('div');content.className='eventcard';content.dataset.y=y;content.innerHTML=`<div class="name">${escapeHtml(name)}</div>${details?`<div class="details">${escapeHtml(details)}</div>`:''}${warning?`<div class="warning ${type==='breakfast'?'breakfast':''}">⚠️ ${escapeHtml(warning)}</div>`:''}`;axis.append(content); }
axis.style.height=(maxY+55)+'px';
for(let n of day.notes){let div=document.createElement('div');div.className='note '+(n.includes('간식')?'attention':'');div.textContent=n;notes.append(div)} });
function layOut(panel){const axis=panel.querySelector('.axis');let bottom=-999;let max=0;for(const item of axis.querySelectorAll('.eventcard')){const y=Number(item.dataset.y);const top=Math.max(y-11,bottom+17);item.style.top=top+'px';bottom=top+item.offsetHeight;max=Math.max(max,y);}axis.style.height=Math.max(max+55,bottom+24)+'px';}
function show(n){[...tabs.children].forEach((b,i)=>b.classList.toggle('active',i===n));[...pages.children].forEach((p,i)=>p.classList.toggle('active',i===n));layOut(pages.children[n]);window.scrollTo({top:0,behavior:'smooth'})};window.addEventListener('resize',()=>{let a=pages.querySelector('.other.active');if(a)layOut(a)});
show(0);
</script></body></html>
